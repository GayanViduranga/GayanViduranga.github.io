<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} | {{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <script>
    (function(){
      var saved = localStorage.getItem('theme');
      var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
      document.documentElement.setAttribute('data-theme', saved || (prefersLight ? 'light' : 'dark'));
    })();
  </script>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="nav">
    <div class="container">
      <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <nav>
        <a class="link {% if page.url == '/' %}active{% endif %}" href="{{ '/' | relative_url }}">Overview</a>
        <a class="link {% if page.url == '/resume/' %}active{% endif %}" href="{{ '/resume/' | relative_url }}">Resume</a>
        <a class="link {% if page.url == '/projects/' %}active{% endif %}" href="{{ '/projects/' | relative_url }}">Portfolio</a>
        <a class="link" href="https://medium.com/@hdgviduranga" target="_blank">Blog</a>
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark and light theme">🌙</button>
      </nav>
    </div>
  </header>

  {{ content }}

  <footer>© {{ site.time | date: "%Y" }} {{ site.title }} · Built with Jekyll</footer>

  <script>
    (function(){
      var root = document.documentElement;
      var btn = document.getElementById('themeToggle');
      function paint(){ btn.textContent = root.getAttribute('data-theme') === 'light' ? '☀️' : '🌙'; }
      btn.addEventListener('click', function(){
        var next = root.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
        root.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
        paint();
      });
      paint();
    })();
  </script>
</body>
</html>
